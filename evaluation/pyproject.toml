[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmr"
version = "0.1.0"
description = "Human-machine reasoning experiments on Bongard-LOGO with LLMs/VLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mohit Vaishnav" }]
keywords = ["bongard", "logo", "visual-reasoning", "llm", "vlm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # LLM / VLM clients
    "openai>=1.50",
    "mistralai>=1.2",
    "google-genai>=1.0",
    "ollama>=0.4.4",

    # Config + I/O
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.9",

    # Data handling
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "Pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/vaishnavmohit/human-machine-reasoning"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hmr = ["py.typed"]
